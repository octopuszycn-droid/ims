<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMS订单同步</title><style>
body{width:340px;margin:0;padding:16px;font:14px system-ui,sans-serif;color:#172033}h1{font-size:17px;margin:0 0 14px}label{display:block;margin:10px 0 5px;color:#475569}input,select,button{box-sizing:border-box;width:100%;height:38px;border:1px solid #cbd5e1;border-radius:6px;padding:0 10px;background:white}button{margin-top:14px;border:0;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}button.login-connected{background:#e5e7eb;color:#374151}button:disabled{opacity:.6}.hint,#status{font-size:12px;color:#64748b;line-height:1.5;margin-top:8px}[hidden]{display:none!important}
</style></head><body>
<h1>打单订单同步到 IMS</h1>
<label for="apiBase">IMS 地址</label><input id="apiBase" value="https://whblf.work">
<div id="auth" class="hint">正在检查 IMS 登录状态…</div>
<button id="login" type="button">打开 IMS 登录</button>
<div id="syncControls" hidden>
  <label for="platform">平台</label><select id="platform"><option value="pinduoduo">拼多多</option><option value="douyin">抖音</option><option value="kuaishou">快手</option></select>
  <button id="sync">同步勾选订单</button>
</div><div id="status"></div><script src="popup.js"></script>
</body></html>
